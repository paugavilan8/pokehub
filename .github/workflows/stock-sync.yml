name: Revisar stock de tiendas

# Cada 10 minutos lee el catálogo público de las tiendas (worker/src/sync-node.ts) y manda al worker de avisos el
# producto sellado de Pokémon; el worker guarda los cambios y envía los correos de "vuelve el stock".
# GitHub no garantiza la hora exacta de los cron: a veces se retrasan unos minutos.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: stock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ALERTS_WORKER_URL: ${{ vars.ALERTS_WORKER_URL || 'https://pullradar-alerts.elpaueto8.workers.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Leer tiendas y enviar al worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Avisos de stock sin desplegar: no hay CLOUDFLARE_API_TOKEN."; exit 0; fi
          if ! curl -sf -m 20 "$ALERTS_WORKER_URL/api/shops" > /dev/null; then echo "El worker de avisos no responde todavía."; exit 0; fi
          export SYNC_TOKEN=$(printf '%s' "pullradar-sync:$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$SYNC_TOKEN"
          node worker/src/sync-node.ts
