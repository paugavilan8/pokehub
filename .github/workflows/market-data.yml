name: Precios diarios

# Descarga la guía de precios de Cardmarket (se publica de madrugada) y el catálogo de TCGdex,
# y sube los cambios. Cloudflare Pages vuelve a construir la web con cada push a main.
on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
  # También al cambiar los scripts de datos o este fichero, para probarlos sin esperar a la madrugada.
  push:
    branches: [main]
    paths:
      - scripts/fetch-market.ts
      - scripts/fetch-graded.ts
      - .github/workflows/market-data.yml

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-market.ts
      # Precios de gradeadas de las cartas más caras (unas pocas cada día). Sin el secreto PPT_API_KEY no hace nada,
      # y si la API falla la web se publica igual con los datos anteriores.
      - run: node scripts/fetch-graded.ts
        continue-on-error: true
        env:
          PPT_API_KEY: ${{ secrets.PPT_API_KEY }}
          PPT_DAILY_CREDITS: ${{ vars.PPT_DAILY_CREDITS || '100' }}
      - run: npm test
      - run: npm run build
      - name: Subir datos si han cambiado
        run: |
          git config user.name "pokehub-bot"
          git config user.email "pokehub-bot@users.noreply.github.com"
          git add src/data/market src/data/graded.json 2>/dev/null || git add src/data/market
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Precios de Cardmarket del $(date -u +%Y-%m-%d)"
            git push
          fi
