# Avisos de stock por correo. Ver worker/README.md para crearlo en tu cuenta de Cloudflare.
name = "pullradar-alerts"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Las tiendas las lee GitHub Actions (.github/workflows/stock-sync.yml) y manda los cambios a /api/sync.
# Aquí solo queda la limpieza diaria de avisos sin confirmar.
[triggers]
crons = ["23 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "pullradar-alerts"
# Pon aquí el id que devuelve `npx wrangler d1 create pullradar-alerts`.
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
# Dirección pública de la web (sin barra final) y desde qué dominios se acepta el formulario.
SITE_URL = "https://pokehub.elpaueto8.workers.dev"
ALLOWED_ORIGINS = "https://pokehub.elpaueto8.workers.dev,http://localhost:4321"
# Remitente de los correos. El dominio tiene que estar verificado en Resend; con onboarding@resend.dev (sin dominio)
# Resend solo entrega al correo de tu propia cuenta, para pruebas. En el despliegue se cambia con la variable MAIL_FROM.
MAIL_FROM = "PullRadar <onboarding@resend.dev>"
# Dirección pública de este worker (para los enlaces de confirmar y darse de baja en los correos).
WORKER_URL = "https://pullradar-alerts.elpaueto8.workers.dev"

# Secretos (no van en este fichero): RESEND_API_KEY y SYNC_TOKEN. Los pone .github/workflows/deploy-alerts.yml.
